steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calldesktech:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calldesktech:latest'

  # Deploy to Cloud Run (env vars are set separately via gcloud run services update)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'calldesktech'
      - '--image'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

images:
  - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/calldesktech:latest'

options:
  logging: CLOUD_LOGGING_ONLY
