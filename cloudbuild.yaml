steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/calldesktech:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/calldesktech:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'calldesktech'
      - '--image'
      - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL},NEXT_PUBLIC_SUPABASE_ANON_KEY=${_SUPABASE_ANON_KEY}'
      - '--set-secrets'
      - 'SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,RETELL_API_KEY=RETELL_API_KEY:latest,CAL_API_KEY=CAL_API_KEY:latest'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'

substitutions:
  _REGION: us-central1
  _SUPABASE_URL: ''
  _SUPABASE_ANON_KEY: ''

images:
  - 'gcr.io/$PROJECT_ID/calldesktech:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/calldesktech:latest'

options:
  logging: CLOUD_LOGGING_ONLY
