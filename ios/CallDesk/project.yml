name: CallDesk
options:
  bundleIdPrefix: com.calldesk
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1

targets:
  CallDesk:
    type: application
    platform: iOS
    sources:
      - path: CallDesk
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: CallDesk
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "CallDesk uses your location to find nearby businesses during setup."
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: targeted
    entitlements:
      path: CallDesk/CallDesk.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
