name: Outreach discovery (daily)

# Finds new agencies, dedupes against existing leads, looks up contacts on the
# agencies' own sites, and drafts emails into the approval queue. Nothing is
# emailed to a prospect here; sending is a separate manual step in /admin/outreach/queue.
#
# Required repo secrets:
#   OUTREACH_DISCOVER_URL  e.g. https://calldesk.tech/api/admin/outreach/discover
#   CRON_SECRET            same value as the CRON_SECRET secret on the Fly app

on:
  schedule:
    - cron: '17 13 * * *' # daily, 13:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (reads and fetches, writes nothing)'
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run discovery
        env:
          URL: ${{ secrets.OUTREACH_DISCOVER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "OUTREACH_DISCOVER_URL and CRON_SECRET repo secrets must be set" >&2
            exit 1
          fi
          curl -sS --fail-with-body --max-time 840 -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"dryRun\": $DRY_RUN}" > out.ndjson
          FINAL=$(grep -v '"heartbeat"' out.ndjson | tail -n 1)
          echo "$FINAL"
          echo "$FINAL" | python3 -c 'import sys,json; d=json.loads(sys.stdin.read()); s=d.get("summary"); sys.exit(0 if s and s["status"]=="ok" else 1)'
